<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111315">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}Eric Wang</title>
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    {% if page.math %}
    <script>
      window.MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
        options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>
    {% endif %}
  </head>
  <body>
    <div class="site-shell{% if page.home %} home-site-shell{% endif %}">
      <header class="site-header{% if page.home %} home-site-header{% endif %}">
        {% if page.home %}<h1 class="site-mark">Eric Wang</h1>{% else %}<a class="site-mark" href="{{ '/' | relative_url }}" aria-label="Eric Wang, home">Eric Wang</a>{% endif %}
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/notes/' | relative_url }}"{% if page.section == 'notes' or page.layout == 'post' %} aria-current="page"{% endif %}>Writing</a>
          <a href="{{ '/projects/' | relative_url }}"{% if page.section == 'projects' %} aria-current="page"{% endif %}>Projects</a>
          <a href="https://github.com/threepoint1four" rel="me">GitHub</a>
        </nav>
      </header>

      <main id="main-content">
        {{ content }}
        {% if page.home %}<footer class="site-footer">© {{ site.time | date: '%Y' }} Eric Wang</footer>{% endif %}
      </main>

      {% unless page.home %}<footer class="site-footer">© {{ site.time | date: '%Y' }} Eric Wang</footer>{% endunless %}
    </div>
  </body>
</html>
